# DATABASE SERVER SETUP
#
# Only the database is configured over SSH. The frontend and backend tiers run
# in auto scaling groups, where instances are created and destroyed on demand
# and have no stable address to connect to, so those instances configure
# themselves at boot from their launch template's user data
# (infra/user_data/app_tier.sh.tftpl).
- name: "Setup database server"
  hosts: database
  remote_user: ubuntu
  become: true
  gather_facts: no

  roles:
    - docker_host

  tasks:
    - name: "Copy docker-compose for database"
      copy:
        src: ../docker-compose-db.yml
        dest: /home/ubuntu/app/docker-compose.yml
        owner: ubuntu
        group: ubuntu

    - name: "Create .env file for database"
      copy:
        content: |
          DB_IMAGE={{ db_image }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
        dest: /home/ubuntu/app/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: "Run docker-compose for database"
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/app
      become: false
