name: Assignment 2 - S4125640 - S4125656

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  deploy:
    name: Build, Push & Deploy with Terraform & Ansible
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./infra
      ANSIBLE_DIR: ./ansible
      AWS_REGION: us-east-1

    steps:
      # 1. Checkout code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Log in to our own ECR registry
      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build & push our own images (replaces rmitdominichynes/sdo-2025:*)
      - name: Build & push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/posts-app-backend:${{ github.sha }} -t $ECR_REGISTRY/posts-app-backend:latest ./backend
          docker push $ECR_REGISTRY/posts-app-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-backend:latest

      - name: Build & push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/posts-app-frontend:${{ github.sha }} -t $ECR_REGISTRY/posts-app-frontend:latest ./frontend
          docker push $ECR_REGISTRY/posts-app-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-frontend:latest

      - name: Build & push db image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -f ./backend/DB.Dockerfile -t $ECR_REGISTRY/posts-app-db:${{ github.sha }} -t $ECR_REGISTRY/posts-app-db:latest ./backend
          docker push $ECR_REGISTRY/posts-app-db:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-db:latest

      # 5. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 6. Terraform Init, Destroy & Apply
      # NOTE: destroy/apply are scoped with -target to the EC2 instances,
      # security groups, and key pair only. This deliberately leaves the ECR
      # repos (infra/ecr.tf) and IAM role (infra/iam.tf) untouched, so pushed
      # images and pull permissions survive across pipeline runs. ECR/IAM
      # resources are created once via a manual `terraform apply` (no
      # -target) the first time this project is set up.
      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Destroy Previous EC2 Infra
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="path_to_ssh_public_key=${{ secrets.SDO_KEY_PUB}}" \
            -var="path_to_ssh_private_key=${{ secrets.SDO_KEY }}" \
            -var="my_ip_address=${{ secrets.MY_IP_ADDRESS }}" \
            -var="allow_all_ip_addresses_to_access_database_server=false" \
            -target=aws_instance.db_server \
            -target=aws_instance.backend_server \
            -target=aws_instance.frontend_server \
            -target=aws_security_group.db_sg \
            -target=aws_security_group.backend_sg \
            -target=aws_security_group.frontend_sg \
            -target=aws_key_pair.deployer_key

      - name: Wait for Terraform to destroy properly
        run: sleep 45

      - name: Apply Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="path_to_ssh_public_key=${{ secrets.SDO_KEY_PUB}}" \
            -var="path_to_ssh_private_key=${{ secrets.SDO_KEY }}" \
            -var="my_ip_address=${{ secrets.MY_IP_ADDRESS }}" \
            -var="allow_all_ip_addresses_to_access_database_server=false"

      # 7. Extract Terraform outputs and pass them to Ansible
      - name: Extract Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "DB_PUBLIC_IP=$(terraform output -raw db_server_public_ip)" >> $GITHUB_ENV
          echo "DB_PRIVATE_IP=$(terraform output -raw db_server_private_ip)" >> $GITHUB_ENV
          echo "BACKEND_PUBLIC_IP=$(terraform output -raw backend_server_public_ip)" >> $GITHUB_ENV
          echo "BACKEND_PRIVATE_IP=$(terraform output -raw backend_server_private_ip)" >> $GITHUB_ENV
          echo "FRONTEND_PUBLIC_IP=$(terraform output -raw frontend_server_public_ip)" >> $GITHUB_ENV

      # 8. Generate Ansible inventory dynamically
      - name: Generate Ansible inventory
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          cat > inventory.yml <<EOF
          all:
            children:
              database:
                hosts:
                  db_server:
                    ansible_host: $DB_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu

              backend:
                hosts:
                  backend_server:
                    ansible_host: $BACKEND_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    db_private_ip: $DB_PRIVATE_IP

              frontend:
                hosts:
                  frontend_server:
                    ansible_host: $FRONTEND_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    backend_public_ip: $BACKEND_PUBLIC_IP
          EOF

      # 9. Wait for instances to boot
      - name: Wait for instances
        run: sleep 45

      # 10. Install Ansible
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      # 11. Add your SSH private key (from GitHub Secrets)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SDO_KEY }}" > ~/.ssh/github_sdo_key
          chmod 600 ~/.ssh/github_sdo_key
          ssh-keyscan -H $FRONTEND_PUBLIC_IP $BACKEND_PUBLIC_IP $DB_PUBLIC_IP >> ~/.ssh/known_hosts

      # 12. Run the Ansible playbook, passing the images we just built and
      #     DB credentials sourced from GitHub Secrets (not hardcoded).
      - name: Run Ansible playbook
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          ansible-playbook -i inventory.yml playbook.yml --extra-vars "\
            aws_region=${{ env.AWS_REGION }} \
            ecr_registry=$ECR_REGISTRY \
            db_image=$ECR_REGISTRY/posts-app-db:${{ github.sha }} \
            backend_image=$ECR_REGISTRY/posts-app-backend:${{ github.sha }} \
            frontend_image=$ECR_REGISTRY/posts-app-frontend:${{ github.sha }} \
            db_user=${{ secrets.DB_USER }} \
            db_password=${{ secrets.DB_PASSWORD }}"

      # 13. Print summary
      - name: Deployment summary
        run: |
          echo "Database server:  $DB_PUBLIC_IP"
          echo "Backend server:    http://$BACKEND_PUBLIC_IP:8080"
          echo "Frontend app:      http://$FRONTEND_PUBLIC_IP:8081"