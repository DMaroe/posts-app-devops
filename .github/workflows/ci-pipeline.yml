name: Posts App AWS Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: posts-app-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Push & Deploy with Terraform & Ansible
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./infra
      ANSIBLE_DIR: ./ansible
      AWS_REGION: us-east-1

    steps:
      # 1. Checkout code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment identity
        env:
          EXPECTED_AWS_USER: github-actions-deploy
        run: |
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          expected_suffix=":user/$EXPECTED_AWS_USER"

          if [[ "$caller_arn" != *"$expected_suffix" ]]; then
            echo "Expected AWS IAM user '$EXPECTED_AWS_USER', but credentials belong to '$caller_arn'." >&2
            exit 1
          fi

          echo "Authenticated as AWS IAM user '$EXPECTED_AWS_USER'."

      # 3. Set up remote Terraform state and provision AWS infrastructure
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Ensure Terraform state bucket exists
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="posts-app-terraform-state-$account_id"

          if ! aws s3api head-bucket --bucket "$state_bucket" 2>/dev/null; then
            aws s3api create-bucket --bucket "$state_bucket" --region "$AWS_REGION"
          fi

          aws s3api put-bucket-versioning \
            --bucket "$state_bucket" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$state_bucket" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$state_bucket" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=posts-app/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"

      - name: Apply Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SDO_KEY_PUB }}
        run: terraform apply -auto-approve

      # 4. Build and push images after Terraform creates the ECR repositories
      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/posts-app-backend:${{ github.sha }} -t $ECR_REGISTRY/posts-app-backend:latest ./backend
          docker push $ECR_REGISTRY/posts-app-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-backend:latest

      - name: Build & push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/posts-app-frontend:${{ github.sha }} -t $ECR_REGISTRY/posts-app-frontend:latest ./frontend
          docker push $ECR_REGISTRY/posts-app-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-frontend:latest

      - name: Build & push db image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -f ./backend/DB.Dockerfile -t $ECR_REGISTRY/posts-app-db:${{ github.sha }} -t $ECR_REGISTRY/posts-app-db:latest ./backend
          docker push $ECR_REGISTRY/posts-app-db:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-db:latest

      # 5. Extract Terraform outputs and pass them to Ansible
      - name: Extract Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "DB_PUBLIC_IP=$(terraform output -raw db_server_public_ip)" >> $GITHUB_ENV
          echo "DB_PRIVATE_IP=$(terraform output -raw db_server_private_ip)" >> $GITHUB_ENV
          echo "BACKEND_PUBLIC_IP=$(terraform output -raw backend_server_public_ip)" >> $GITHUB_ENV
          echo "BACKEND_PRIVATE_IP=$(terraform output -raw backend_server_private_ip)" >> $GITHUB_ENV
          echo "FRONTEND_PUBLIC_IP=$(terraform output -raw frontend_server_public_ip)" >> $GITHUB_ENV

      # 6. Generate Ansible inventory dynamically
      - name: Generate Ansible inventory
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          cat > inventory.yml <<EOF
          all:
            children:
              database:
                hosts:
                  db_server:
                    ansible_host: $DB_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu

              backend:
                hosts:
                  backend_server:
                    ansible_host: $BACKEND_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    db_private_ip: $DB_PRIVATE_IP

              frontend:
                hosts:
                  frontend_server:
                    ansible_host: $FRONTEND_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    backend_public_ip: $BACKEND_PUBLIC_IP
          EOF

      # 7. Wait for instances to boot
      - name: Wait for instances
        run: sleep 45

      # 8. Install Ansible
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      # 9. Add the SSH private key from GitHub Secrets
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SDO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_sdo_key
          chmod 600 ~/.ssh/github_sdo_key
          ssh-keyscan -H $FRONTEND_PUBLIC_IP $BACKEND_PUBLIC_IP $DB_PUBLIC_IP >> ~/.ssh/known_hosts

      # 10. Run the Ansible playbook, passing the images we just built and
      #     DB credentials sourced from GitHub Secrets (not hardcoded).
      - name: Run Ansible playbook
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          ansible-playbook -i inventory.yml playbook.yml --extra-vars "\
            aws_region=${{ env.AWS_REGION }} \
            ecr_registry=$ECR_REGISTRY \
            db_image=$ECR_REGISTRY/posts-app-db:${{ github.sha }} \
            backend_image=$ECR_REGISTRY/posts-app-backend:${{ github.sha }} \
            frontend_image=$ECR_REGISTRY/posts-app-frontend:${{ github.sha }} \
            db_user=${{ secrets.DB_USER }} \
            db_password=${{ secrets.DB_PASSWORD }}"

      # 11. Print summary
      - name: Deployment summary
        run: |
          echo "Database server:  $DB_PUBLIC_IP"
          echo "Backend server:    http://$BACKEND_PUBLIC_IP:8080"
          echo "Frontend app:      http://$FRONTEND_PUBLIC_IP:8081"
