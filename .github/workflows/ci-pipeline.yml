name: Assignment 2 - S4125640 - S4125656

on:
  push:
    branches:
      - task/sectionD
  pull_request:
    branches:
      - task/sectionD

jobs:
  deploy:
    name: Deploy with Terraform & Ansible
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./infra
      ANSIBLE_DIR: ./ansible

    steps:
      # 1. Checkout code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 3. Configure AWS credentials using GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1 

      # 4. Terraform Init & Apply
      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init
      - name: Destroy Previous Terraform State
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -var="path_to_ssh_public_key=${{ secrets.SDO_KEY_PUB}}" -var="path_to_ssh_private_key=${{ secrets.SDO_KEY }}" -var="my_ip_address=${{ secrets.MY_IP_ADDRESS }}" -var="allow_all_ip_addresses_to_access_database_server=false" 
      - name: Wait for Terraform to destroy properly
        run: sleep 45
      # Ensure AWS credentials are set in the environment for Terraform
      - name: Apply Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var="path_to_ssh_public_key=${{ secrets.SDO_KEY_PUB}}" -var="path_to_ssh_private_key=${{ secrets.SDO_KEY }}" -var="my_ip_address=${{ secrets.MY_IP_ADDRESS }}" -var="allow_all_ip_addresses_to_access_database_server=false"

      # 5. Extract Terraform outputs and pass them to Ansible
      - name: Extract Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Database Server - Public: $DB_PUBLIC_IP, Private: $DB_PRIVATE_IP"
          echo "Backend Server 1: $BACKEND_IP_1"
          echo "Backend Server 2: $BACKEND_IP_2"
          echo "Backend ALB: $BACKEND_ALB_DNS"
          echo "Frontend Server 1: $FRONTEND_IP_1"
          echo "Frontend Server 2: $FRONTEND_IP_2"
          echo "Frontend ALB: $FRONTEND_ALB_DNS"

      # 6. Generate Ansible inventory dynamically
      - name: Generate Ansible inventory
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          cat > inventory.yml <<EOF
          all:
            children:
              database:
                hosts:
                  db_server:
                    ansible_host: $DB_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
              
              backend:
                hosts:
                  backend_server_1:
                    ansible_host: $BACKEND_IP_1
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    db_private_ip: $DB_PRIVATE_IP
                  backend_server_2:
                    ansible_host: $BACKEND_IP_2
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    db_private_ip: $DB_PRIVATE_IP
              
              frontend:
                hosts:
                  frontend_server_1:
                    ansible_host: $FRONTEND_IP_1
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    backend_alb_dns: $BACKEND_ALB_DNS
                  frontend_server_2:
                    ansible_host: $FRONTEND_IP_2
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
                    backend_alb_dns: $BACKEND_ALB_DNS
          EOF

      # 7. Wait for instances to boot
      - name: Wait for instances
        run: sleep 45

      # 8. Install Ansible
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      # 9. Add your SSH private key (from GitHub Secrets)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SDO_KEY }}" > ~/.ssh/github_sdo_key
          chmod 600 ~/.ssh/github_sdo_key
          ssh-keyscan -H $FRONTEND_IP_1 $FRONTEND_IP_2 $BACKEND_IP_1 $BACKEND_IP_2 $DB_PUBLIC_IP >> ~/.ssh/known_hosts

      # 10. Run the Ansible playbook
      - name: Run Ansible playbook
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: ansible-playbook -i inventory.yml playbook.yml