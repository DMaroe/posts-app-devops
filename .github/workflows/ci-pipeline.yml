name: Posts App AWS Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: posts-app-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Push & Deploy with Terraform & Ansible
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./infra
      ANSIBLE_DIR: ./ansible
      AWS_REGION: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SDO_KEY_PUB }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      # 1. Checkout code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment identity
        env:
          EXPECTED_AWS_USER: github-actions-deploy
        run: |
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          expected_suffix=":user/$EXPECTED_AWS_USER"

          if [[ "$caller_arn" != *"$expected_suffix" ]]; then
            echo "Expected AWS IAM user '$EXPECTED_AWS_USER', but credentials belong to '$caller_arn'." >&2
            exit 1
          fi

          echo "Authenticated as AWS IAM user '$EXPECTED_AWS_USER'."

      # 3. Set up remote Terraform state
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Verify Terraform state bucket exists
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="posts-app-terraform-state-$account_id"

          if ! aws s3api head-bucket --bucket "$state_bucket" 2>/dev/null; then
            echo "::error::State bucket '$state_bucket' does not exist or is not accessible to this role."
            echo "::error::Run infra/bootstrap (see infra/bootstrap/README.md) once as an admin before using this pipeline."
            exit 1
          fi

          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=posts-app/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=posts-app-terraform-locks" \
            -backend-config="encrypt=true"

      # 4. Create the ECR repositories before building, so the images have
      #    somewhere to be pushed to. The app tiers are deliberately NOT created
      #    yet: their launch templates bake in the image tag, so they are
      #    applied after the images for this commit exist.
      - name: Ensure ECR repositories exist
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.frontend \
            -target=aws_ecr_repository.db

      # 5. Build and push this commit's images
      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/posts-app-backend:${{ github.sha }} -t $ECR_REGISTRY/posts-app-backend:latest ./backend
          docker push $ECR_REGISTRY/posts-app-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-backend:latest

      - name: Build & push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/posts-app-frontend:${{ github.sha }} -t $ECR_REGISTRY/posts-app-frontend:latest ./frontend
          docker push $ECR_REGISTRY/posts-app-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-frontend:latest

      - name: Build & push db image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          docker build -f ./backend/DB.Dockerfile -t $ECR_REGISTRY/posts-app-db:${{ github.sha }} -t $ECR_REGISTRY/posts-app-db:latest ./backend
          docker push $ECR_REGISTRY/posts-app-db:${{ github.sha }}
          docker push $ECR_REGISTRY/posts-app-db:latest

      # 6. Apply the full infrastructure pinned to this commit's image tag.
      #    Changing the tag changes the launch templates, which rolls the auto
      #    scaling groups onto the new images.
      - name: Apply Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve

      # 7. Extract the outputs the rest of the pipeline needs
      - name: Extract Terraform outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "DB_PUBLIC_IP=$(terraform output -raw db_server_public_ip)" >> $GITHUB_ENV
          echo "DB_PRIVATE_IP=$(terraform output -raw db_server_private_ip)" >> $GITHUB_ENV
          echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> $GITHUB_ENV
          echo "FRONTEND_ASG=$(terraform output -raw frontend_asg_name)" >> $GITHUB_ENV
          echo "BACKEND_ASG=$(terraform output -raw backend_asg_name)" >> $GITHUB_ENV

      # 8. Configure the database tier with Ansible. The app tiers configure
      #    themselves from user data, so they are not in this inventory.
      - name: Generate Ansible inventory
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          cat > inventory.yml <<EOF
          all:
            children:
              database:
                hosts:
                  db_server:
                    ansible_host: $DB_PUBLIC_IP
                    ansible_ssh_private_key_file: ~/.ssh/github_sdo_key
                    ansible_user: ubuntu
          EOF

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SDO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_sdo_key
          chmod 600 ~/.ssh/github_sdo_key
          ssh-keyscan -H $DB_PUBLIC_IP >> ~/.ssh/known_hosts || true

      - name: Run Ansible playbook
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          ansible-playbook -i inventory.yml playbook.yml --extra-vars "\
            aws_region=${{ env.AWS_REGION }} \
            ecr_registry=$ECR_REGISTRY \
            db_image=$ECR_REGISTRY/posts-app-db:${{ github.sha }} \
            db_user=${{ secrets.DB_USER }} \
            db_password=${{ secrets.DB_PASSWORD }}"

      # 9. A deployment is not finished until the rolling replacement of the
      #    app tiers has actually succeeded.
      - name: Wait for rolling deployments
        run: |
          for asg in "$FRONTEND_ASG" "$BACKEND_ASG"; do
            echo "Waiting for rolling deployment of $asg..."

            for attempt in $(seq 1 90); do
              status="$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$asg" \
                --max-records 1 \
                --query 'InstanceRefreshes[0].Status' \
                --output text)"

              case "$status" in
                Successful|None)
                  echo "$asg: $status"
                  break
                  ;;
                Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                  echo "::error::$asg instance refresh finished with status $status"
                  exit 1
                  ;;
                *)
                  echo "$asg: $status"
                  sleep 20
                  ;;
              esac

              if [ "$attempt" -eq 90 ]; then
                echo "::error::$asg instance refresh did not finish in time"
                exit 1
              fi
            done
          done

      # 10. Print summary
      - name: Deployment summary
        run: |
          echo "Twitties app:     $FRONTEND_URL"
          echo "Database server:  $DB_PUBLIC_IP"
