services:
  db:
    image: ${DB_IMAGE}
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: posts
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-service
    environment:
      PORT: 8080
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-service
    environment:
      PORT: 8081
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:8081"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
