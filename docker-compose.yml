services:
  db:
    image: rmitdominichynes/sdo-2025:db
    container_name: postgres-db
    environment:
      POSTGRES_USER: foo-user
      POSTGRES_PASSWORD: secret-foo-password
      POSTGRES_DB: posts
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    image: rmitdominichynes/sdo-2025:backend
    container_name: backend-service
    environment:
      PORT: 8080
      DB_USER: foo-user
      DB_PASSWORD: secret-foo-password
      DB_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    image: rmitdominichynes/sdo-2025:frontend
    container_name: frontend-service
    environment:
      PORT: 8081
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:8081"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge